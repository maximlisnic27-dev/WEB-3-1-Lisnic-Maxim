<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Piatra, Hârtia, Foarfeca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="joc">
        <h1>Piatra, Hârtia, Foarfeca</h1>


        <div id="butoane">
            <button id="btnPiatra">Piatra</button>
            <button id="btnHartia">Hârtia</button>
            <button id="btnFoarfeca">Foarfeca</button>
        </div>


        <div class="zona">
            <p>Alegerea ta: <b id="alegereUtilizator">-</b></p>
            <p>Alegerea calculatorului: <b id="alegereCalculator">-</b></p>
        </div>

        <div class="zona">
            <h2 id="rezultat">Alege o variantă pentru a începe!</h2>
        </div>

        <div class="zona">
            <p>Tu: <b id="scorUtilizator">0</b></p>
            <p>Calculator: <b id="scorCalculator">0</b></p>
            <p>Egalități: <b id="scorEgalitati">0</b></p>
            <p>Runde jucate: <b id="totalRunde">0</b></p>
            <p id="mesajConducere"></p>
        </div>

        <h2 id="castigatorFinal"></h2>

        <button id="btnJocNou">Joc nou</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
